<div style="min-height: 100vh; background-color: #f3f4f6; font-family: 'Segoe UI', system-ui, sans-serif; padding: 2rem 1rem;">
  <div style="max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 2rem;">
    
    <h2 style="color: #1f2937; margin-bottom: 1.5rem; text-align: center; font-size: 1.8rem; font-weight: 700;">
      📝 To-Do List
    </h2>

    <!-- Formulário Moderno e Responsivo -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: #f9fafb; padding: 16px; border-radius: 8px; margin-bottom: 2rem;">
      <input type="text" [(ngModel)]="newTitle" placeholder="Título da tarefa (Obrigatório)*" 
             style="padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;" />
      
      <input type="text" [(ngModel)]="newDescription" placeholder="Descrição curta" 
             style="padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;" />
      
      <input type="date" [(ngModel)]="newDueDate" 
             style="padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; color: #4b5563;" />
      
      <button (click)="adicionarTarefa()" 
              style="background-color: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s;">
        Adicionar
      </button>
    </div>

    <!-- Lista de Tarefas -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      @for (task of tasks(); track task.id) {
        <div [style.background-color]="task.completed ? '#f9fafb' : 'white'"
             [style.border-left]="task.completed ? '4px solid #9ca3af' : '4px solid #2563eb'"
             style="display: flex; align-items: center; justify-content: space-between; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 8px; transition: all 0.2s; gap: 12px; flex-wrap: wrap;">
          
          <!-- Checkbox e Texto -->
          <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 250px;">
            <input type="checkbox" [checked]="task.completed" (change)="alternarStatus(task.id)"
                   style="width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb;" />
            
            <div>
              <h4 [style.text-decoration]="task.completed ? 'line-through' : 'none'"
                  [style.color]="task.completed ? '#6b7280' : '#1f2937'"
                  style="margin: 0; font-size: 1.05rem; font-weight: 600;">
                {{ task.title }}
              </h4>
              @if (task.description) {
                <p [style.text-decoration]="task.completed ? 'line-through' : 'none'"
                   style="margin: 4px 0 0 0; font-size: 0.85rem; color: #6b7280;">
                  {{ task.description }}
                </p>
              }
            </div>
          </div>

          <!-- Data e Botão de Excluir -->
          <div style="display: flex; align-items: center; gap: 16px; justify-content: space-between; width: 100%; max-width: 200px;">
            @if (task.dueDate) {
              <span style="font-size: 0.8rem; background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-weight: 500;">
                📅 {{ task.dueDate }}
              </span>
            } @else { <div></div> }

            <button (click)="excluirTarefa(task.id)" 
                    style="background: none; border: none; color: #ef4444; font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem;">
              Remover
            </button>
          </div>

        </div>
      } @empty {
        <div style="text-align: center; padding: 2rem; color: #6b7280;">
          <p style="margin: 0; font-size: 1.1rem;">Parabéns! Não tem nenhuma tarefa pendente. 🎉</p>
        </div>
      }
    </div>

  </div>
</div>
